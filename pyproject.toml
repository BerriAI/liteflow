[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "liteflow"
version = "0.1.0a1"
description = "Typed workflows for the LiteLLM gateway"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.8,<3", "openai>=1.99,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
cli = ["rich>=13,<15"]

[project.scripts]
liteflow = "liteflow.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
